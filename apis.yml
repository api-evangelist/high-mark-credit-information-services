name: High Mark Credit Information Services
description: High Mark Credit Information Services (now operating as CRIF High Mark) is one of India's
  four RBI-licensed credit bureaus, headquartered in Mumbai. It maintains credit information on retail,
  microfinance, and commercial borrowers, and delivers credit reports, bureau scores, analytics, portfolio
  monitoring, fraud-detection, and origination-decisioning solutions to banks, NBFCs, microfinance
  institutions, insurers, and telecom providers. The bureau is best known for its microfinance credit
  information services and pan-India retail and commercial credit databases. It was surfaced as a
  portfolio company of Battery Ventures and profiled in the API Evangelist network; it publishes no
  public developer portal or API specification, so this profile captures company identity and domain
  security posture only.
